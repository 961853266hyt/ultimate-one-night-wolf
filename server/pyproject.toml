[project]
name = "ultimate-one-night-wolf-server"
version = "0.1.0"
description = "一夜终极狼人：游戏服务端"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
